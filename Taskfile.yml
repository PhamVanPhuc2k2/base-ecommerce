version: '3'

env:
  DATABASE_URL: postgres://app:app@localhost:5432/base_ecommerce?sslmode=disable

tasks:
  up:
    desc: Khởi động hạ tầng dev
    cmd: docker compose -f deploy/compose.dev.yml up -d --wait

  down:
    desc: Dừng hạ tầng dev
    cmd: docker compose -f deploy/compose.dev.yml down

  migrate:
    desc: Chạy migration
    dir: apps/api
    cmd: goose -dir db/migrations postgres "$DATABASE_URL" up

  migrate-down:
    desc: Lùi một migration (chỉ dùng khi phát triển)
    dir: apps/api
    cmd: goose -dir db/migrations postgres "$DATABASE_URL" down

  migrate-create:
    desc: 'Tạo migration mới, ví dụ: task migrate-create -- them_bang_products'
    dir: apps/api
    # goose create mặc định đánh version bằng timestamp. Bắt buộc dùng lệnh này
    # thay vì tự đặt tên 00002_..., vì hai nhánh song song sẽ cùng chọn số 00002
    # và goose panic khi thấy trùng version.
    cmd: goose -dir db/migrations create {{.CLI_ARGS}} sql

  sqlc:
    desc: Sinh code Go từ file SQL
    dir: apps/api
    cmd: sqlc generate

  openapi:
    desc: Sinh type TypeScript từ api/openapi.yaml
    cmds:
      - npx --yes openapi-typescript@7 api/openapi.yaml -o apps/web/lib/api/generated/schema.ts

  build:
    desc: Biên dịch toàn bộ
    dir: apps/api
    cmd: go build ./...

  vet:
    desc: Phân tích tĩnh của Go
    dir: apps/api
    cmd: go vet ./...

  lint:
    desc: Chạy linter
    dir: apps/api
    cmd: golangci-lint run

  arch:
    desc: Kiểm tra chiều phụ thuộc kiến trúc
    cmd: bash scripts/check-arch.sh

  api-codes:
    desc: Đối chiếu mã lỗi trong openapi.yaml với mã lỗi thật trong code Go
    cmd: bash scripts/check-openapi-codes.sh

  error-messages:
    desc: Đối chiếu mã lỗi trong openapi.yaml với bảng thông điệp tiếng Việt của web
    cmd: bash scripts/check-error-messages.sh

  tree:
    desc: Đối chiếu cây thư mục ở README mục 4 với đĩa thật
    cmd: bash scripts/check-tree.sh

  sqlc-drift:
    desc: Kiểm code sqlc đã sinh có khớp với file .sql không
    # Sinh lại rồi hỏi git xem có gì đổi. Không có bước này thì sửa .sql mà quên
    # chạy `task sqlc` sẽ không ai báo: code cũ vẫn build, vẫn chạy, chỉ là chạy
    # câu SQL khác với câu đang nằm trong repo. Đã xảy ra thật ở P0.2.
    cmds:
      - task: sqlc
      - git diff --exit-code -- apps/api/internal/catalog/adapter/pgstore/gen apps/api/internal/outbox/gen

  check:
    desc: Chạy tất cả kiểm tra tĩnh — chạy trước mỗi lần commit
    # Dự án không dùng unit test. Đây là lưới an toàn duy nhất chạy tự động,
    # nên hãy chạy nó thường xuyên. Mọi thứ còn lại phải kiểm chứng bằng tay
    # theo các bước ghi trong kế hoạch.
    cmds:
      - task: build
      - task: vet
      - task: lint
      - task: arch
      - task: api-codes
      - task: error-messages
      - task: tree
      - task: sqlc-drift

  web-dev:
    desc: Chạy Next.js ở chế độ phát triển
    dir: apps/web
    cmd: npm run dev

  web-build:
    desc: Build Next.js production
    dir: apps/web
    cmd: npm run build

  web-check:
    desc: Biome + kiểm kiểu TypeScript
    dir: apps/web
    cmds:
      - npm run lint
      - npm run typecheck

  run:
    desc: Chạy API server trên máy (vòng lặp sửa–chạy nhanh nhất)
    dir: apps/api
    cmd: go run ./cmd/api

  docker-build:
    desc: 'Build image API. Ví dụ: task docker-build -- worker'
    cmd: >-
      docker build
      --build-arg BINARY={{.CLI_ARGS | default "api"}}
      --build-arg VERSION=$(git rev-parse --short HEAD)
      -t base-ecommerce-{{.CLI_ARGS | default "api"}}:dev
      apps/api

  web-docker-build:
    desc: Build image storefront Next.js (kiểm nhanh mà không phải dựng cả compose)
    # Build context là apps/web chứ không phải gốc repo: apps/web có
    # package-lock.json riêng và Dockerfile chép thẳng `package.json` ở gốc
    # context.
    cmd: docker build -t base-ecommerce-web:dev apps/web

  up-docker:
    desc: Dựng hạ tầng VÀ toàn bộ tiến trình ứng dụng trong container (api, worker, outboxrelay, web)
    cmd: docker compose -f deploy/compose.dev.yml --profile app up -d --build --wait

  down-docker:
    desc: Dừng cả hạ tầng lẫn mọi tiến trình ứng dụng trong container
    cmd: docker compose -f deploy/compose.dev.yml --profile app down

  logs:
    desc: 'Xem log. Ví dụ: task logs -- api'
    cmd: docker compose -f deploy/compose.dev.yml logs -f {{.CLI_ARGS}}
