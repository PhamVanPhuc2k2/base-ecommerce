name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: '1.26'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum
      - name: Build
        working-directory: apps/api
        run: go build ./...
      - name: Vet
        working-directory: apps/api
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum
      # Phải là v7 trở lên: action v6 cài golangci-lint v1, không đọc được
      # file cấu hình schema version "2".
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2      # pin cứng để CI và máy dev dùng cùng một bản
          working-directory: apps/api

  api-codes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - run: pip install pyyaml
      - run: bash scripts/check-openapi-codes.sh

  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-tree.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build image thật. Không có bước này thì Dockerfile chỉ được kiểm khi ai
      # đó nhớ chạy tay, và nó sẽ hỏng vào đúng lúc cần deploy.
      - run: docker build --build-arg BINARY=api --build-arg VERSION=${{ github.sha }} -t bec-api:ci apps/api
      - run: docker build --build-arg BINARY=healthcheck -t bec-healthcheck:ci apps/api

  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum
      - run: bash scripts/check-arch.sh
