version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: internal/catalog/adapter/pgstore/queries
    gen:
      go:
        package: gen
        out: internal/catalog/adapter/pgstore/gen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: timestamptz
            go_type: time.Time
