version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/repository/pgstore/queries
    gen:
      go:
        package: gen
        out: internal/repository/pgstore/gen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: timestamptz
            go_type: time.Time
          # Cột thời gian cho phép NULL (used_at, email_verified_at, deleted_at)
          # thành *time.Time thay vì pgtype.Timestamptz — cùng quy ước với
          # entry outbox bên dưới, để tầng repository không phải đổi kiểu tay.
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
  - engine: postgresql
    schema: migrations
    queries: internal/repository/outbox/queries
    gen:
      go:
        package: gen
        out: internal/repository/outbox/gen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
