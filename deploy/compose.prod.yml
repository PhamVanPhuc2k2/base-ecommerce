# Bố trí production trên một VPS. Xem docs/design/05-deployment.md mục 3.
#
#   docker compose -f deploy/compose.prod.yml --env-file .env.prod up -d
#
# Khác compose.dev.yml ở những chỗ quan trọng:
#   - KHÔNG build tại chỗ. Chỉ chạy image đã build và đã test ở CI, ghim theo
#     git SHA. Build trên máy production nghĩa là thứ đang chạy không còn là thứ
#     đã được kiểm.
#   - KHÔNG mở cổng database/Redis ra ngoài. Chỉ reverse proxy chạm tới API.
#   - Mọi bí mật đến từ file .env.prod, không viết thẳng vào đây.
#   - Có giới hạn tài nguyên và chính sách restart.

name: base-ecommerce

# Biến môi trường chung của ba binary Go, tách thành anchor RIÊNG.
#
# ⚠️ Merge key `<<` của YAML chỉ gộp NÔNG. Service nào viết `<<: *api-common`
# rồi khai `environment:` của riêng mình thì mất SẠCH biến chung — không lỗi,
# chỉ là tiến trình khởi động với DATABASE_URL rỗng. Nên worker/outboxrelay gộp
# `<<: *go-env` vào BÊN TRONG environment của chúng.
x-go-env: &go-env
  APP_ENV: production
  APP_VERSION: ${GIT_SHA}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
  # Không có dòng này thì config lấy mặc định amqp://...@localhost:5672/ — trong
  # container localhost là chính nó, relay và worker không bao giờ nối được
  # broker. Tên service `rabbitmq`, cổng TRONG container.
  RABBITMQ_URL: ${RABBITMQ_URL}
  # Ký access token (P2.1). BẮT BUỘC ≥ 32 byte ngẫu nhiên; config từ chối khởi
  # động nếu thiếu hoặc còn giá trị dev. Đổi nó = đăng xuất MỌI người sau 15 phút.
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET phải được đặt}
  HTTP_HANDLER_TIMEOUT: ${HTTP_HANDLER_TIMEOUT:-30s}
  # PHẢI lớn hơn HTTP_HANDLER_TIMEOUT — config từ chối khởi động nếu sai.
  HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-35s}
  HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-30s}
  # Object storage (P1.4): S3/R2 thật, KHÔNG chạy MinIO trên VPS — ảnh gốc là
  # dữ liệu không được mất cùng ổ đĩa của máy chủ. Config từ chối khởi động nếu
  # S3_SECRET_KEY còn là mật khẩu dev.
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-${S3_ENDPOINT}}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-catalog}
  S3_REGION: ${S3_REGION:-auto}
  S3_USE_SSL: "true"

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-api-common: &api-common
  # KHÔNG BAO GIỜ dùng tag `latest`. Không truy được đang chạy code nào, và
  # `docker compose pull` có thể lấy về image khác với cái vừa test.
  image: ${REGISTRY}/base-ecommerce-api:${GIT_SHA}
  restart: unless-stopped
  environment: *go-env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  # Dài hơn HTTP_SHUTDOWN_TIMEOUT. Để mặc định 10s thì Docker SIGKILL giữa lúc
  # đang rút êm, và mọi request đang xử lý bị cắt ngang.
  stop_grace_period: 45s
  logging: *logging

services:
  api:
    <<: *api-common
    # Chỉ mở ra loopback. Reverse proxy (Caddy/nginx) trên cùng máy mới chạm tới;
    # không có gì từ mạng ngoài nói chuyện trực tiếp với API.
    ports: ["127.0.0.1:8080:8080"]
    environment:
      <<: *go-env
      # Web (BFF) và reverse proxy trên máy chủ (đi qua gateway Docker) đều nằm
      # trong dải này. Chỉ socket từ đây mới được đọc X-Forwarded-For.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
    healthcheck:
      # /healthcheck là binary tĩnh trong image — distroless không có shell/curl.
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # outboxrelay và worker: cùng Dockerfile với api, khác --build-arg BINARY, nên
  # mỗi cái một image riêng. Lý do chi tiết của từng giá trị dưới đây nằm ở
  # compose.dev.yml — hai file phải giữ khớp nhau.
  #
  # ⚠️ outboxrelay: ĐÚNG MỘT BẢN. Không đặt deploy.replicas — SKIP LOCKED làm hai
  # bản "nhảy cóc" qua nhau và phá thứ tự sự kiện (xem compose.dev.yml).
  outboxrelay:
    <<: *api-common
    image: ${REGISTRY}/base-ecommerce-outboxrelay:${GIT_SHA}
    environment:
      <<: *go-env
      DB_MAX_CONNS: "3"
      DB_MIN_CONNS: "1"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    # Không healthcheck: relay không mở cổng HTTP. Dấu hiệu sống là log và cột
    # published_at. PHẢI lớn hơn roundTimeout (60s) của relay.
    stop_grace_period: 70s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  # worker chạy được nhiều bản: processed_events chặn xử lý trùng.
  worker:
    <<: *api-common
    image: ${REGISTRY}/base-ecommerce-worker:${GIT_SHA}
    environment:
      <<: *go-env
      # Chỉ worker gửi thư (P2.3). Thiếu thì compose từ chối chạy; worker còn tự
      # chặn MAIL_FROM mặc định dev lúc khởi động.
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST phải được đặt}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM phải được đặt}
      DB_MAX_CONNS: "3"
      DB_MIN_CONNS: "1"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    # Không healthcheck: worker không mở cổng HTTP. PHẢI lớn hơn handleTimeout
    # (30s) của consumer cộng thời gian xử lý nốt message đã prefetch.
    stop_grace_period: 45s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  # Storefront Next.js. Image riêng build từ apps/web/Dockerfile.
  web:
    image: ${REGISTRY}/base-ecommerce-web:${GIT_SHA}
    restart: unless-stopped
    environment:
      # Tên service, KHÔNG phải localhost — gọi thẳng api trong mạng nội bộ, không
      # vòng ra reverse proxy.
      API_URL: http://api:8080/api/v1
      # BẮT BUỘC, và PHẢI là tên miền thật (https://...). Đây là gốc của canonical,
      # sitemap.xml và JSON-LD. Để lọt localhost lên production thì Google gộp mọi
      # tín hiệu xếp hạng về localhost và trang thật biến mất khỏi kết quả tìm
      # kiếm — không lỗi nào báo. `:?` làm compose TỪ CHỐI chạy khi thiếu biến.
      SITE_URL: ${SITE_URL:?SITE_URL phải là tên miền thật, ví dụ https://example.vn}
      IMGPROXY_URL: http://imgproxy:8080
      IMGPROXY_SOURCE_PREFIX: s3://${S3_BUCKET:-catalog}/
    # Chỉ loopback, giống api: reverse proxy trên cùng máy mới chạm tới.
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      # service_started, không phải healthy: Next.js không gọi API lúc khởi động,
      # và API chết thì trang tự hiện <ErrorState> tiếng Việt.
      api: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Next.js nhận SIGTERM thì server.close() — chờ request đang dở xong rồi mới
    # thoát (exit 143 là CỐ Ý, xem apps/web/Dockerfile). Request storefront chờ
    # backend tối đa HTTP_HANDLER_TIMEOUT, nên phải dài hơn con số đó.
    stop_grace_period: 40s
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # imgproxy đọc ảnh từ S3 thật. Cùng hai lớp chặn như dev (chỉ-preset, chỉ đọc
  # bucket) — xem deploy/compose.dev.yml. Không mở cổng: storefront gọi nó qua
  # mạng nội bộ; nên cấu hình reverse proxy chuyển /img/* thẳng tới đây để bỏ
  # một chặng qua Node (thiết kế 05).
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:${IMGPROXY_VERSION:-latest}
    restart: unless-stopped
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: https://${S3_ENDPOINT}
      IMGPROXY_S3_REGION: ${S3_REGION:-auto}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      IMGPROXY_ALLOWED_SOURCES: s3://${S3_BUCKET:-catalog}/
      IMGPROXY_ONLY_PRESETS: "true"
      # PHẢI khớp compose.dev.yml và apps/web/lib/image-loader.ts.
      IMGPROXY_PRESETS: w128=rs:fit:128:0,w256=rs:fit:256:0,w384=rs:fit:384:0,w640=rs:fit:640:0,w828=rs:fit:828:0,w1080=rs:fit:1080:0,w1920=rs:fit:1920:0
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AUTO_AVIF: "true"
      IMGPROXY_TTL: "31536000"
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # KHÔNG có `ports`. Database chỉ nói chuyện qua mạng nội bộ của compose.
    # Muốn vào bằng psql từ ngoài thì dùng SSH tunnel, đừng mở cổng.
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      # -h là bắt buộc: không có nó pg_isready đi qua Unix socket, mà socket đã
      # lắng nghe ngay trong giai đoạn initdb → báo healthy trong khi cổng TCP
      # vẫn từ chối kết nối.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 2G }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # P0.2 chỉ dùng Redis làm cache. noeviction + AOF ở đây là AN TOÀN NHƯNG SAI
    # HƯỚNG cho vai trò cache: hết bộ nhớ sẽ TỪ CHỐI GHI thay vì xóa key cũ.
    # P4 tách thành redis-cache (allkeys-lru, không persistence) và redis-data
    # (noeviction, AOF) — xem docs/design/03-redis-cache.md.
    command:
      ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { memory: 768M }

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    # ĐỪNG XÓA. RabbitMQ lấy tên node Erlang từ hostname và lưu Mnesia ở
    # /var/lib/rabbitmq/mnesia/rabbit@<hostname>. Không cố định hostname thì mỗi
    # lần tạo lại container sinh node mới rỗng và bỏ rơi dữ liệu cũ — toàn bộ
    # queue, exchange và message durable mất trong im lặng.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    # Management UI (15672) KHÔNG mở ra ngoài. Vào qua SSH tunnel.
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits: { memory: 1G }

volumes:
  pgdata:
  redisdata:
  rabbitdata:
