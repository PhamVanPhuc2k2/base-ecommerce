name: base-ecommerce-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: base_ecommerce
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      # Phải có -h. Không có nó pg_isready đi qua Unix socket, mà socket đã lắng
      # nghe ngay trong giai đoạn initdb → container báo healthy trong khi cổng
      # TCP 5432 vẫn từ chối kết nối, làm `task migrate` lỗi lúc khởi động nguội.
      test: ["CMD-SHELL", "pg_isready -U app -d base_ecommerce -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    # Cổng host là 6380 vì máy dev đã có một Redis khác chiếm 6379.
    # Bên trong container vẫn là 6379, nên production không bị ảnh hưởng.
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # ĐỪNG XÓA. RabbitMQ lấy tên node Erlang từ hostname và lưu Mnesia ở
    # /var/lib/rabbitmq/mnesia/rabbit@<hostname>. Không cố định hostname thì mỗi
    # lần tạo lại container sinh node mới rỗng và bỏ rơi dữ liệu cũ — toàn bộ
    # queue, exchange và message durable mất trong im lặng, không có lỗi nào.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    healthcheck:
      # check_port_connectivity chứ không phải ping: ping chỉ kiểm node Erlang
      # và xanh trước khi cổng AMQP 5672 nhận kết nối.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO — object storage tương thích S3, giữ file ảnh gốc (P1.4). Production
  # đổi sang S3/R2 thật bằng biến môi trường, code không đổi.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: app
      # Tối thiểu 8 ký tự — MinIO từ chối khởi động nếu ngắn hơn.
      MINIO_ROOT_PASSWORD: app-secret-dev
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tạo bucket một lần rồi thoát. Bucket RIÊNG TƯ: không ai đọc thẳng được từ
  # MinIO, ảnh chỉ ra ngoài qua imgproxy — nên imgproxy là cửa duy nhất và
  # mọi ảnh trả cho khách đều đã được thu nhỏ, đổi định dạng.
  #
  # Profile "init" riêng: `up --wait` coi MỌI container đã thoát là thất bại,
  # kể cả thoát 0. Taskfile chạy service này bằng `compose run --rm` sau up.
  minio-init:
    profiles: ["init"]
    # Dùng lại image minio/minio: nó có sẵn mc, còn image minio/mc riêng không
    # kéo được từ Docker Hub (pull access denied).
    image: minio/minio:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 app app-secret-dev && mc mb --ignore-existing local/catalog && mc anonymous set none local/catalog"]
    restart: "no"

  # imgproxy — thu nhỏ, đổi định dạng (WebP/AVIF theo header Accept) ảnh đọc từ
  # bucket catalog. Hai lớp chặn lạm dụng, không cần ký URL:
  #   - IMGPROXY_ALLOWED_SOURCES: chỉ đọc được s3://catalog/ — không thể biến
  #     imgproxy thành proxy tải ảnh bất kỳ trên internet (SSRF, băng thông).
  #   - IMGPROXY_ONLY_PRESETS: URL chỉ được gọi TÊN preset, không truyền tham số
  #     tùy ý — không ai bắt máy chủ dựng hàng nghìn kích thước lạ để đốt CPU.
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:latest
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      IMGPROXY_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: app
      AWS_SECRET_ACCESS_KEY: app-secret-dev
      IMGPROXY_ALLOWED_SOURCES: s3://catalog/
      IMGPROXY_ONLY_PRESETS: "true"
      # Bậc chiều rộng khớp deviceSizes/imageSizes của next/image (xem
      # apps/web/lib/image-loader.ts). rs:fit giữ tỉ lệ, không cắt.
      IMGPROXY_PRESETS: w128=rs:fit:128:0,w256=rs:fit:256:0,w384=rs:fit:384:0,w640=rs:fit:640:0,w828=rs:fit:828:0,w1080=rs:fit:1080:0,w1920=rs:fit:1920:0
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AUTO_AVIF: "true"
      IMGPROXY_TTL: "31536000"
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mailpit nhận MỌI thư của môi trường dev và không gửi đi đâu cả — mã OTP
  # đăng ký bằng email thật cũng chỉ nằm ở http://localhost:8025. Worker chạy
  # trên máy (`task run-worker`) gửi vào localhost:1025 (mặc định của
  # SMTP_HOST/SMTP_PORT), worker trong compose gửi vào mailpit:1025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025" # giao diện web + API đọc thư (script kiểm chứng dùng)
      - "127.0.0.1:1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Service api nằm sau profile "app": `task up` thường ngày CHỈ dựng hạ tầng và
  # vẫn nhanh như trước, còn API thì chạy bằng `task run` trên máy để giữ vòng
  # lặp sửa–chạy ~1 giây.
  #
  # Dùng `task up-docker` khi cần kiểm những thứ mà `go run` trên host KHÔNG
  # kiểm được:
  #   - graceful shutdown có thật sự chạy không (docker stop gửi SIGTERM cho PID 1)
  #   - image có build và chạy được trên distroless không
  #   - dự án có chạy trên máy sạch không, hay đang dựa vào công cụ cài sẵn
  api:
    profiles: ["app"]
    build:
      context: ../apps/api
      args:
        BINARY: api
        VERSION: dev-docker
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      HTTP_ADDR: ":8080"
      HTTP_HANDLER_TIMEOUT: 30s
      # PHẢI lớn hơn HTTP_HANDLER_TIMEOUT, nếu không response lỗi lúc hết giờ
      # không kịp ghi ra cho client. Config từ chối khởi động nếu đặt sai.
      HTTP_WRITE_TIMEOUT: 35s
      # Tên service, không phải localhost: bên trong mạng của compose thì
      # "postgres" và "redis" mới phân giải được.
      #
      # Và là cổng TRONG container: Redis là 6379 chứ không phải 6380. 6380 chỉ
      # là cổng ánh xạ ra host để né Redis của dự án khác.
      DATABASE_URL: postgres://app:app@postgres:5432/base_ecommerce?sslmode=disable
      REDIS_ADDR: redis:6379
      # Không có dòng này thì config lấy mặc định amqp://...@localhost:5672/ —
      # trong container thì localhost là chính container đó, nên mọi lần nối
      # broker đều hỏng. cmd/api chịu được (event chỉ ghi xuống outbox), nên lỗi
      # này im lặng cho tới lúc có ai đó thêm một chỗ publish trực tiếp.
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672/
      # Object storage (P1.4). Endpoint nội bộ để API đọc/xóa file; endpoint
      # CÔNG KHAI để ký URL upload — người upload ở ngoài container, và chữ ký S3
      # gồm cả host (đặc tả P1.4 mục 2.3).
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_ENDPOINT: localhost:9000
      S3_ACCESS_KEY: app
      S3_SECRET_KEY: app-secret-dev
      S3_BUCKET: catalog
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # KHÔNG dùng CMD-SHELL hay curl: image distroless không có shell và không
      # có curl, healthcheck sẽ luôn đỏ trong khi ứng dụng vẫn chạy tốt. /healthcheck
      # là một binary tĩnh được chép vào image đúng cho việc này.
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    # Mặc định docker stop chờ 10 giây rồi SIGKILL. HTTP_SHUTDOWN_TIMEOUT là 30s,
    # nên để mặc định thì shutdown bị cắt ngang giữa chừng và ta không bao giờ
    # biết nó có chạy xong hay không.
    stop_grace_period: 40s

  # outboxrelay đọc bảng outbox và đẩy sự kiện sang RabbitMQ. Cùng profile "app"
  # với api: `task up` thường ngày chỉ dựng hạ tầng, còn `task up-docker` dựng
  # cả tiến trình nền để kiểm những thứ chạy trên host không kiểm được (dừng êm
  # khi nhận SIGTERM, image distroless chạy được, PID 1 đúng).
  #
  # ⚠️ TUYỆT ĐỐI KHÔNG đặt `deploy.replicas` cho service này.
  #
  # Nghe có vẻ an toàn vì FetchUnpublished dùng FOR UPDATE SKIP LOCKED, nên hai
  # bản relay sẽ không bao giờ giành cùng một dòng — không lỗi, không publish
  # trùng. Nhưng chính SKIP LOCKED là vấn đề: bản B "nhảy cóc" qua những dòng
  # bản A đang giữ và publish event có id LỚN HƠN ra broker trước. Consumer nhận
  # product.updated trước product.created cho cùng một sản phẩm và ghi đè bằng
  # dữ liệu cũ. Không có lỗi nào, không có message nào mất — chỉ có dữ liệu sai
  # ở đầu kia, và nó chỉ xuất hiện khi có tải.
  #
  # Muốn scale thì phải phân mảnh theo hash(aggregate_id) % N để mọi event của
  # cùng một aggregate luôn về cùng một bản (P7, xem thiết kế 01 mục 8).
  outboxrelay:
    profiles: ["app"]
    build:
      context: ../apps/api
      args:
        BINARY: outboxrelay
        VERSION: dev-docker
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      # Tên service, không phải localhost — trong mạng của compose thì
      # "postgres" và "rabbitmq" mới phân giải được, và cổng là cổng TRONG
      # container.
      DATABASE_URL: postgres://app:app@postgres:5432/base_ecommerce?sslmode=disable
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672/
      # Relay chỉ cần vài kết nối: một cho vòng đẩy sự kiện, một cho job dọn.
      # Mặc định 20 mà nhân với số tiến trình thì Postgres hết slot rất nhanh.
      DB_MAX_CONNS: "3"
      DB_MIN_CONNS: "1"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    # KHÔNG có healthcheck, và đây là lựa chọn có ý thức.
    #
    # /healthcheck trong image gọi một URL HTTP, mà relay không mở cổng HTTP nào
    # — nó không phục vụ request, nó chỉ poll database. Gắn healthcheck HTTP vào
    # đây thì container LUÔN unhealthy trong khi nó đang làm việc hoàn toàn bình
    # thường, và `docker compose up --wait` sẽ treo rồi thất bại.
    #
    # Hai lựa chọn còn lại đều tệ hơn ở P0.3: (a) mở một HTTP server chỉ để phục
    # vụ /healthz — thêm cổng, thêm bề mặt, cho một tiến trình không có client
    # nào; (b) thêm subcommand `outboxrelay healthcheck` tự kiểm — nó chỉ kiểm
    # được từ một tiến trình KHÁC, nên không nói lên được gì về tiến trình đang
    # chạy. Khi P5 có hạ tầng thật (Kubernetes liveness/readiness) thì làm cách
    # (a) cho tử tế, kèm rabbitmq.NewHealthChecker(pub, false) — xem health.go.
    #
    # Dấu hiệu sống của relay lúc này là log và cột published_at, không phải một
    # cái đèn xanh giả.
    #
    # PHẢI lớn hơn roundTimeout của relay (60s). Vòng thường chỉ mất vài chục
    # mili-giây, nhưng khi broker chết thì mỗi message tốn tới 5 giây chờ dial
    # và cả lô chạm trần 60 giây — đúng lúc đó mà docker stop cắt ở mặc định 10
    # giây thì container bị SIGKILL, exit code 137, và ta không bao giờ biết
    # đoạn dừng êm có chạy xong hay không.
    stop_grace_period: 70s

  # worker đọc queue catalog.indexer (sự kiện sản phẩm) và mailer (gửi thư,
  # P2.3). Cùng profile
  # "app" với api và outboxrelay: `task up` thường ngày chỉ dựng hạ tầng, còn
  # `task up-docker` dựng cả tiến trình nền.
  #
  # Khác outboxrelay ở chỗ service này CHẠY NHIỀU BẢN ĐƯỢC. RabbitMQ chia
  # message cho các consumer cùng queue, và bản nào xử lý trùng thì
  # processed_events chặn lại (khóa chính là (consumer, event_id), nên hai bản
  # cùng xử lý một sự kiện thì bản thứ hai thấy MarkProcessed trả false).
  # Đổi lại, thứ tự giữa các sự kiện của CÙNG một sản phẩm không còn bảo đảm khi
  # chạy nhiều bản — P7 muốn scale thì phải tính tới chuyện đó.
  worker:
    profiles: ["app"]
    build:
      context: ../apps/api
      args:
        BINARY: worker
        VERSION: dev-docker
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      # Tên service, không phải localhost — trong mạng của compose thì
      # "postgres" và "rabbitmq" mới phân giải được, và cổng là cổng TRONG
      # container.
      DATABASE_URL: postgres://app:app@postgres:5432/base_ecommerce?sslmode=disable
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672/
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Vòng lặp consume xử lý tuần tự nên một kết nối là đủ; để 3 cho thoải
      # mái. Mặc định 20 mà nhân với số tiến trình thì Postgres hết slot nhanh.
      DB_MAX_CONNS: "3"
      DB_MIN_CONNS: "1"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      # service_started, không phải healthy: Mailpit chết thì thư vào queue
      # retry và tự gửi lại — không phải lý do để worker không chạy.
      mailpit: { condition: service_started }
    # KHÔNG có healthcheck, cùng lý do đã ghi ở outboxrelay: /healthcheck trong
    # image gọi một URL HTTP, mà worker không mở cổng HTTP nào. Dấu hiệu sống
    # của nó là log và bảng processed_events, không phải một cái đèn xanh giả.
    #
    # PHẢI lớn hơn handleTimeout của consumer (30s) cộng thời gian xử lý nốt
    # những message đã prefetch. 45 giây: docker stop gửi SIGTERM, worker hủy
    # consumer rồi xử lý nốt phần đang dở. Để mặc định 10 giây thì container bị
    # SIGKILL giữa chừng, exit code 137, và ta không bao giờ biết đoạn dừng êm
    # có chạy xong hay không. Message chưa ack thì không mất (broker giao lại),
    # nhưng mỗi lần deploy lại sinh một đợt xử lý trùng không cần thiết.
    stop_grace_period: 45s

  # web là storefront Next.js. Cùng profile "app": `task up` thường ngày chỉ dựng
  # hạ tầng, `task up-docker` dựng thêm toàn bộ tiến trình ứng dụng.
  #
  # Chạy trong container kiểm được ba thứ mà `task web-dev` trên máy KHÔNG kiểm
  # được, và cả ba đều đã suýt lọt:
  #   - `output: 'standalone'` không tự chép .next/static → trang mất sạch CSS
  #   - server.js mặc định nghe localhost → không ai từ ngoài container vào được
  #   - Next.js phải gọi API qua tên service, không phải localhost
  web:
    profiles: ["app"]
    build:
      context: ../apps/web
    environment:
      # Tên service, KHÔNG phải localhost. Bên trong container, `localhost` trỏ
      # về chính tiến trình Next.js — gọi API kiểu đó luôn bị từ chối kết nối.
      # Và là cổng TRONG container: api nghe 8080.
      API_URL: http://api:8080/api/v1
      # imgproxy trong mạng compose. Route Handler /img/* đọc biến này LÚC CHẠY —
      # không phải NEXT_PUBLIC_*, nên một image dùng được cho mọi môi trường.
      IMGPROXY_URL: http://imgproxy:8080
      # Gốc của mọi URL tuyệt đối: <link rel="canonical">, sitemap.xml, JSON-LD.
      # Ở dev thì đúng là localhost:3000. Trên production PHẢI đổi thành tên
      # miền thật — xem chú thích ở .env.example, đặt sai thì Google gộp mọi
      # tín hiệu xếp hạng về localhost và tên miền thật biến mất khỏi kết quả.
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      # Chỉ service_started, KHÔNG phải service_healthy. Next.js không gọi API
      # lúc khởi động — mọi lời gọi xảy ra khi có request — và trang đã có sẵn
      # đường xử lý ApiError để hiện <ErrorState> tiếng Việt khi backend chết.
      # Bắt chờ api healthy chỉ làm `up --wait` lâu hơn mà không đổi hành vi.
      api: { condition: service_started }
    healthcheck:
      # Image có Node nên dùng thẳng `node -e` được — không cần curl (alpine
      # không có sẵn) và cũng không cần binary healthcheck riêng như bên API.
      # 127.0.0.1 chứ không phải localhost: trong container `localhost` có thể
      # phân giải ra ::1 trước, mà server nghe 0.0.0.0 (IPv4).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Next.js khởi động nhanh nhưng lần đầu vẫn mất vài giây để nạp xong.
      start_period: 10s
    # Next.js đóng HTTP server êm khi nhận SIGTERM, và request của storefront
    # đều ngắn. 20 giây là dư — nhưng vẫn phải khai rõ hơn là để mặc định 10s,
    # vì một request đang chờ backend chậm cũng ngốn tới HTTP_HANDLER_TIMEOUT.
    stop_grace_period: 20s

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  miniodata:
