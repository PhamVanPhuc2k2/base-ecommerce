      summary: Nhập hàng (receipt), điều chỉnh (adjustment) hoặc kiểm kê (count)
      description: >-
        Mỗi thao tác ghi đúng một dòng sổ cái cùng transaction với thay đổi
        tồn. on_hand không được xuống dưới reserved (409 INSUFFICIENT_STOCK).
