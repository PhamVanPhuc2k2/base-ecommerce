        - { name: cursor, in: query, schema: { type: string, format: uuid }, description: "meta.next_cursor của trang trước" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
