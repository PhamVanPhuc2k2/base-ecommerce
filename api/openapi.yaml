  /admin/brands/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateBrand
      summary: Sửa thương hiệu
      security: [{ bearerAuth: [] }]
      x-required-permission: catalog.taxonomy.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBrandRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Brand" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteBrand
      summary: Xóa thương hiệu không còn sản phẩm
      security: [{ bearerAuth: [] }]
      x-required-permission: catalog.taxonomy.write
      responses:
        "204": { description: Đã xóa }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /admin/products:
    post:
      operationId: createProduct
      summary: Tạo sản phẩm
      security: [{ bearerAuth: [] }]
      x-required-permission: catalog.products.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductRequest" }
      responses:
        "201":
          description: Đã tạo
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /admin/products/{id}:
    patch:
      operationId: updateProduct
      summary: Sửa sản phẩm
      security: [{ bearerAuth: [] }]
      x-required-permission: catalog.products.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProductRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        # 409 rất hay gặp ở màn hình sửa: đổi tên sinh slug mới, đụng slug của
        # sản phẩm khác -> DUPLICATE_SLUG.
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /admin/products/{id}/variants:
    post:
      operationId: addVariant
      summary: Thêm phiên bản cho sản phẩm
      description: Trả về CẢ sản phẩm — giá "từ" của sản phẩm có thể đổi theo.
      security: [{ bearerAuth: [] }]
      x-required-permission: catalog.products.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVariantRequest" }
      responses:
        "201":
          description: Đã thêm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /admin/products/{id}/variants/{variantId}:
    patch:
      operationId: updateVariant
      summary: Sửa phiên bản (giá, tùy chọn, trạng thái, thứ tự)
      description: >-
        Không có DELETE: đơn hàng sẽ trỏ vào phiên bản, nên ngừng bán là
        `status: inactive`. Trả về CẢ sản phẩm.
      security: [{ bearerAuth: [] }]
      x-required-permission: catalog.products.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateVariantRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /admin/products/{id}/publish:
    post:
      operationId: publishProduct
      summary: Đăng bán sản phẩm
      security: [{ bearerAuth: [] }]
      x-required-permission: catalog.products.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token từ /auth/login, sống 15 phút. Chỉ mang định danh người
        dùng — quyền được tra mỗi request.

  responses:
    Problem:
      description: Lỗi theo RFC 7807
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type:       { type: string }
        title:      { type: string }
        status:     { type: integer }
        code:
          type: string
          description: Mã ổn định để frontend map sang thông điệp tiếng Việt.
          enum:
            # platform/httpx — có thể xảy ra ở bất kỳ endpoint nào
            - INTERNAL_ERROR
            # 413 riêng của ảnh (P1.4)
            - IMAGE_TOO_LARGE
            # xác thực (P2.1)
            - INVALID_CREDENTIALS
            - INVALID_REFRESH_TOKEN
            - ACCOUNT_DISABLED
            # OTP qua email (P2.3)
            - INVALID_OTP
            - EMAIL_ALREADY_VERIFIED
            # sổ địa chỉ (P2.4)
            - ADDRESS_LIMIT_REACHED
            - UNKNOWN_ADDRESS
            # kho + tồn kho (P3.1)
            - INVALID_LOCATION_CODE
            - LOCATION_NAME_INVALID
            - INVALID_LOCATION_KIND
            - LOCATION_ADDRESS_REQUIRED
            - DUPLICATE_LOCATION_CODE
            - UNKNOWN_LOCATION
            - LOCATION_NOT_FOUND
            - LOCATION_INACTIVE
            - VARIANT_NOT_FOUND
            - INVALID_MOVEMENT_KIND
            - INVALID_QUANTITY
            - STOCK_REASON_REQUIRED
            - INSUFFICIENT_STOCK
            - IDEMPOTENCY_KEY_REUSED
            - INVALID_IDEMPOTENCY_KEY
            - INVALID_MOVEMENT_FILTER
            # phân quyền (P2.2)
            - FORBIDDEN
            - RATE_LIMITED
            - INVALID_PAGINATION
            - MALFORMED_REQUEST
            - METHOD_NOT_ALLOWED
            - PAYLOAD_TOO_LARGE
            - REQUEST_CANCELED
            - REQUEST_TIMEOUT
            - ROUTE_NOT_FOUND
            - UNAUTHENTICATED
            - VALIDATION_FAILED
            # catalog/domain — lỗi validate (422)
            - INVALID_SKU
            - NAME_REQUIRED
            - NAME_TOO_LONG
            - INVALID_PRICE
            - UNSUPPORTED_CURRENCY
            - INVALID_SLUG
            - NO_IMAGE
            - PRICE_REQUIRED
            - INVALID_STATUS
            - CATEGORY_NOT_FOUND
            - BRAND_NOT_FOUND
            - CATEGORY_NAME_INVALID
            - BRAND_NAME_INVALID
            - CATEGORY_CYCLE
            - VARIANT_REQUIRED
            - INVALID_VARIANT_OPTIONS
            - INVALID_VARIANT_STATUS
            - NO_ACTIVE_VARIANT
            - INVALID_ATTRIBUTE_CODE
            - INVALID_EMAIL
            - WEAK_PASSWORD
            - INVALID_ROLE_CODE
            - ROLE_NAME_INVALID
            - UNKNOWN_PERMISSION
            - SYSTEM_ROLE_IMMUTABLE
            - CANNOT_CHANGE_OWN_ROLES
            - ROLE_NOT_FOUND
            - FULL_NAME_INVALID
            - UNSUPPORTED_IMAGE_TYPE
            - INVALID_IMAGE
            - UPLOAD_NOT_FOUND
            - ATTRIBUTE_NAME_INVALID
            - INVALID_ATTRIBUTE_TYPE
            - INVALID_ATTRIBUTE_OPTIONS
            - ATTRIBUTE_NOT_FOUND
            - DUPLICATE_ATTRIBUTE_ASSIGNMENT
            # catalog/domain — xung đột (409)
            - ALREADY_PUBLISHED
            - DUPLICATE_SKU
            - DUPLICATE_SLUG
            - DUPLICATE_CATEGORY_SLUG
            - DUPLICATE_BRAND_SLUG
            - CATEGORY_HAS_CHILDREN
            - CATEGORY_HAS_PRODUCTS
            - BRAND_HAS_PRODUCTS
            - DUPLICATE_VARIANT_OPTIONS
            - DUPLICATE_ATTRIBUTE_CODE
            - EMAIL_TAKEN
            - DUPLICATE_ROLE_CODE
            - ROLE_IN_USE
            - ATTRIBUTE_IN_USE
            # catalog/domain — không tìm thấy (404). UNKNOWN_* là tài nguyên
            # trên đường dẫn; khác CATEGORY_NOT_FOUND/BRAND_NOT_FOUND (422) là
            # dữ liệu gửi lên tham chiếu thứ không tồn tại.
            - PRODUCT_NOT_FOUND
            - UNKNOWN_CATEGORY
            - UNKNOWN_BRAND
            - UNKNOWN_VARIANT
            - UNKNOWN_ATTRIBUTE
            - UNKNOWN_MEDIA
            - UNKNOWN_ROLE
            - UNKNOWN_USER
            # catalog/domain — tham số không hợp lệ (400)
            - INVALID_SORT
            - PAGE_TOO_DEEP
        request_id:
          type: string
          description: |
            Luôn có mặt trong response (không bao giờ bị lược bỏ), nhưng có
            thể là chuỗi rỗng nếu middleware RequestID chưa gán được giá trị.
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field:
                type: string
                description: 'Đường dẫn tới trường, ví dụ "attributes.ram" hay "variants[1].options.mau".'
              code:
                type: string
                description: >-
                  Mã lỗi CẤP TRƯỜNG (khác Problem.code). Với thuộc tính theo danh
                  mục: UNKNOWN_ATTRIBUTE_KEY, INVALID_ATTRIBUTE_VALUE,
                  ATTRIBUTE_REQUIRED, VARIANT_ATTRIBUTE_ON_PRODUCT,
                  PRODUCT_ATTRIBUTE_ON_VARIANT. Với ảnh: UNKNOWN_IMAGE (trường
                  "images[i]") — key chưa upload hoặc chưa /complete.
              message: { type: string }

    Product:
      type: object
      required: [id, slug, name, short_description, category_id, brand_id,
                 price, currency, status, attributes, images, variants, created_at, updated_at]
      properties:
        id:                { type: string, format: uuid }
        slug:              { type: string }
        name:              { type: string }
        short_description: { type: string }
        category_id:       { type: string, format: uuid }
        brand_id:          { type: string, format: uuid }
        price:
          type: string
          description: |
            GIÁ "TỪ": giá thấp nhất trong các phiên bản đang bán (từ 0.4.0; trước
            đó là giá của sản phẩm duy nhất). Lọc `price_min`/`price_max` và sắp
            xếp theo giá đều dùng con số này. Chuỗi thập phân. Số 0 thừa ở cuối BỊ CẮT ("25990000.50" đọc lại thành "25990000.5"), nên đừng so sánh bằng chuỗi — hãy parse bằng thư viện decimal. KHÔNG BAO GIỜ dùng number:
            JSON number qua JS mất chính xác với NUMERIC(15,2) lớn (IEEE 754
            double chỉ biểu diễn chính xác số nguyên tới 2^53), nên giá đọc lại
            có thể lệch so với giá đã ghi. Server luôn trả amount đã được
            round-trip qua shopspring/decimal, không định dạng hiển thị (dấu
            phẩy nghìn, ký hiệu tiền tệ...) — việc đó là của frontend.
        currency:
          type: string
          description: Hiện chỉ có "VND" — hệ thống chưa hỗ trợ đa tiền tệ.
          examples: ["VND"]
        status:     { type: string, enum: [draft, live, archived] }
        attributes: { type: object, additionalProperties: { type: string } }
        images:
          type: array
          items: { type: string }
          description: >-
            KHÓA media (`Media.key`, ví dụ "products/0190….jpg"), KHÔNG phải URL
            — từ 0.6.0. Hiển thị qua imgproxy của storefront. Ghi sản phẩm với
            key chưa ready trả 422, trường images[i] mã UNKNOWN_IMAGE.
        variants:
          type: array
          description: >-
            Sắp theo `position` rồi `id`. Endpoint công khai chỉ trả phiên bản
            `active`; response của các lệnh quản trị trả đủ, kể cả `inactive`.
          items: { $ref: "#/components/schemas/Variant" }
        created_at:
          type: string
          format: date-time
          description: RFC 3339, luôn ở múi giờ UTC (hậu tố "Z").
        updated_at:
          type: string
          format: date-time
          description: RFC 3339, luôn ở múi giờ UTC (hậu tố "Z").

    ProductList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        meta:
          type: object
          required: [page, limit, total, total_pages, max_page, has_next, has_prev]
          properties:
            page:        { type: integer }
            limit:       { type: integer }
            total:       { type: integer }
            total_pages: { type: integer }
            max_page:
              type: integer
              description: >-
                Trang sâu nhất truy cập được (vượt qua trả 400 PAGE_TOO_DEEP).
                `has_next` đã tính tới trần này, nên cứ theo `has_next` là an
                toàn: nó về false ở trang `max_page` dù `total_pages` còn lớn hơn.
            has_next:    { type: boolean }
            has_prev:    { type: boolean }

    Category:
      type: object
      required: [id, slug, name, position, children]
      properties:
        id:       { type: string, format: uuid }
        slug:     { type: string }
        name:     { type: string }
        position: { type: integer }
        children:
          type: array
          items: { $ref: "#/components/schemas/Category" }

    Variant:
      type: object
      required: [id, sku, price, currency, options, status, position]
      properties:
        id:       { type: string, format: uuid }
        sku:      { type: string, description: "Duy nhất toàn hệ thống, không đổi được." }
        price:    { type: string, description: "Chuỗi thập phân VND — xem Product.price." }
        currency: { type: string, examples: ["VND"] }
        options:
          type: object
          additionalProperties: { type: string }
          description: 'Tùy chọn phân biệt các phiên bản, ví dụ {"ram": "16GB", "màu": "Đen"}.'
        status:   { type: string, enum: [active, inactive] }
        position: { type: integer }

    CreateVariantRequest:
      type: object
      additionalProperties: false
      required: [sku, price]
      properties:
        sku:      { type: string, maxLength: 64 }
        price:    { type: string, description: "Chuỗi thập phân VND. Nháp chưa có giá thì gửi \"0\"." }
        currency: { type: string, default: "VND" }
        options:
          type: object
          additionalProperties: { type: string }
          description: "Tối đa 10 cặp. Không được trùng options của phiên bản khác cùng sản phẩm (409 DUPLICATE_VARIANT_OPTIONS)."
        position: { type: integer, default: 0 }

    UpdateVariantRequest:
      type: object
      additionalProperties: false
      description: >-
        Sửa từng phần, trường vắng mặt giữ nguyên. Không đổi được `sku`. Với sản
        phẩm đang live: không thể tắt phiên bản đang bán cuối cùng (422
        NO_ACTIVE_VARIANT) hay để một phiên bản đang bán có giá 0 (422
        PRICE_REQUIRED).
      properties:
        price:    { type: string }
        currency: { type: string, default: "VND", description: "Chỉ có ý nghĩa khi gửi kèm `price`." }
        options:  { type: object, additionalProperties: { type: string } }
        status:   { type: string, enum: [active, inactive] }
        position: { type: integer }

    Role:
      type: object
      required: [id, code, name, is_system, permissions, updated_at]
      properties:
        id:          { type: string, format: uuid }
        code:        { type: string }
        name:        { type: string }
        is_system:   { type: boolean, description: "super_admin: mọi quyền, không sửa/xóa được." }
        permissions: { type: array, items: { type: string } }
        updated_at:  { type: string, format: date-time }

    CreateRoleRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:        { type: string, pattern: "^[a-z0-9]+(_[a-z0-9]+)*$" }
        name:        { type: string, maxLength: 100 }
        permissions: { type: array, items: { type: string }, description: "Chỉ quyền có trong GET /admin/permissions." }

    UpdateRoleRequest:
      type: object
      additionalProperties: false
      properties:
        name:        { type: string, maxLength: 100 }
        permissions: { type: array, items: { type: string }, description: "THAY toàn bộ tập quyền." }

    Location:
      type: object
      required: [id, code, name, kind, address, sells_online, priority, active]
      properties:
        id:           { type: string, format: uuid }
        code:         { type: string }
        name:         { type: string }
        kind:         { type: string, enum: [warehouse, showroom] }
        address:      { type: string, nullable: true }
        sells_online: { type: boolean, description: "Tồn của kho này có tính vào tồn bán online" }
        priority:     { type: integer, description: "Số nhỏ được phân bổ trước (P3.2)" }
        active:       { type: boolean }

    CreateLocationRequest:
      type: object
      additionalProperties: false
      required: [code, name, kind, sells_online, priority]
      properties:
        code:         { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 32 }
        name:         { type: string, maxLength: 100 }
        kind:         { type: string, enum: [warehouse, showroom] }
        address:      { type: string, maxLength: 255, description: "Bắt buộc với showroom" }
        sells_online: { type: boolean }
        priority:     { type: integer }

    UpdateLocationRequest:
      type: object
      additionalProperties: false
      properties:
        name:         { type: string, maxLength: 100 }
        kind:         { type: string, enum: [warehouse, showroom] }
        address:      { type: string, maxLength: 255, nullable: true, description: "null = xóa (không được với showroom)" }
        sells_online: { type: boolean }
        priority:     { type: integer }
        active:       { type: boolean }

    RecordStockMovementRequest:
      type: object
      additionalProperties: false
      required: [location_id, variant_id, kind, quantity]
      properties:
        location_id: { type: string, format: uuid }
        variant_id:  { type: string, format: uuid }
        kind:        { type: string, enum: [receipt, adjustment, count] }
        quantity:
          type: integer
          description: >-
            receipt: số nhập (> 0). adjustment: phần chênh có dấu (≠ 0).
            count: số đếm được (tuyệt đối, ≥ 0).
        reason: { type: string, maxLength: 500, description: "Bắt buộc với adjustment và count" }
        ref:    { type: string, maxLength: 100, description: "Mã chứng từ (phiếu nhập…)" }

    StockMovement:
      type: object
      required: [id, location_id, variant_id, kind, on_hand_delta, reserved_delta, on_hand_after, reserved_after, created_at]
      properties:
        id:             { type: string, format: uuid }
        location_id:    { type: string, format: uuid }
        variant_id:     { type: string, format: uuid }
        kind:           { type: string, enum: [receipt, adjustment, count, reserve, release, commit] }
        on_hand_delta:  { type: integer }
        reserved_delta: { type: integer }
        on_hand_after:  { type: integer }
        reserved_after: { type: integer }
        reason:         { type: string, nullable: true }
        ref:            { type: string, nullable: true }
        actor_id:       { type: string, format: uuid, nullable: true }
        created_at:     { type: string, format: date-time }

    StockLevel:
      type: object
      required: [on_hand, reserved, available]
      properties:
        on_hand:   { type: integer }
        reserved:  { type: integer }
        available: { type: integer, description: "on_hand − reserved" }

    StockMovementResult:
      type: object
      required: [movement, level]
      properties:
        movement: { $ref: "#/components/schemas/StockMovement" }
        level:    { $ref: "#/components/schemas/StockLevel" }

    VariantStock:
      type: object
      required: [variant_id, levels, totals]
      properties:
        variant_id: { type: string, format: uuid }
        levels:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/StockLevel"
              - type: object
                required: [location]
                properties:
                  location: { $ref: "#/components/schemas/Location" }
        totals:
          allOf:
            - $ref: "#/components/schemas/StockLevel"
            - type: object
              required: [online_available]
              properties:
                online_available: { type: integer, description: "Chỉ kho đang hoạt động và bán online" }

    Address:
      type: object
      required: [id, recipient_name, phone, province, ward, street, is_default, updated_at]
      properties:
        id:             { type: string, format: uuid }
        recipient_name: { type: string }
        phone:          { type: string, description: "Đã chuẩn hóa: 0xxxxxxxxx" }
        province:       { type: string, description: "Tỉnh/thành phố" }
        ward:           { type: string, description: "Phường/xã (2 cấp hành chính, sau sắp xếp 2025)" }
        street:         { type: string, description: "Số nhà, tên đường" }
        is_default:     { type: boolean }
        updated_at:     { type: string, format: date-time }

    AddressRequest:
      type: object
      additionalProperties: false
      description: >-
        Tạo: mọi trường bắt buộc. Sửa: trường không gửi thì giữ nguyên. Lỗi
        theo trường nằm ở errors[] với code INVALID_PHONE hoặc FIELD_INVALID.
      properties:
        recipient_name: { type: string, maxLength: 100 }
        phone:          { type: string, description: "Di động VN; nhận +84 / 84 / dấu cách / dấu chấm" }
        province:       { type: string, maxLength: 100 }
        ward:           { type: string, maxLength: 100 }
        street:         { type: string, maxLength: 255 }

    User:
      type: object
      required: [id, email, full_name, email_verified, created_at]
      properties:
        id:             { type: string, format: uuid }
        email:          { type: string, description: "Đã chuẩn hóa: chữ thường, không khoảng trắng." }
        full_name:      { type: string }
        email_verified: { type: boolean }
        created_at:     { type: string, format: date-time }
        permissions:
          type: array
          items: { type: string }
          description: >-
            Chỉ có ở GET /me. Để client ẩn/hiện chức năng — server vẫn kiểm quyền
            mỗi request, không tin danh sách này.

    Session:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_at, user]
      properties:
        access_token:       { type: string }
        token_type:         { type: string, enum: [Bearer] }
        expires_in:         { type: integer, description: "Số giây access token còn sống." }
        refresh_token:
          type: string
          description: >-
            Dùng MỘT lần. Giữ ở server (cookie HttpOnly của storefront), không bao
            giờ đưa cho JavaScript phía trình duyệt.
        refresh_expires_at: { type: string, format: date-time }
        user:               { $ref: "#/components/schemas/User" }

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, full_name]
      properties:
        email:     { type: string, maxLength: 254 }
        password:  { type: string, minLength: 8, maxLength: 128 }
        full_name: { type: string, maxLength: 100 }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:    { type: string }
        password: { type: string }

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    Media:
      type: object
      required: [id, key, content_type, size, status, created_at]
      properties:
        id:           { type: string, format: uuid }
        key:          { type: string, description: "Đặt giá trị này vào Product.images." }
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp], description: "Sau /complete: loại THẬT dò từ nội dung file." }
        size:         { type: integer, description: "Byte. Sau /complete: kích thước thật trên storage." }
        status:       { type: string, enum: [pending, ready] }
        created_at:   { type: string, format: date-time }

    MediaUpload:
      type: object
      required: [url, fields]
      properties:
        url:    { type: string }
        fields: { type: object, additionalProperties: { type: string } }

    CreateMediaRequest:
      type: object
      additionalProperties: false
      required: [content_type, size]
      properties:
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size:         { type: integer, minimum: 1, maximum: 10485760 }

    Attribute:
      type: object
      required: [id, code, name, type, unit, options, filterable, variant]
      properties:
        id:   { type: string, format: uuid }
        code: { type: string, description: "Khóa trong attributes/options và trong tham số attr.<code>. Bất biến." }
        name: { type: string }
        type:
          type: string
          enum: [text, number, boolean, enum]
          description: >-
            Bất biến. number: số thập phân thuần ("16", "15.6") — đơn vị nằm ở
            `unit`, không nằm trong giá trị. boolean: "true"/"false".
        unit:       { type: string }
        options:    { type: array, items: { type: string }, description: "Giá trị cho phép của kiểu enum; rỗng với kiểu khác." }
        filterable: { type: boolean, description: "Có hiện trong /products/facets không." }
        variant:
          type: boolean
          description: >-
            Bất biến. true: chỉ đặt trong Variant.options (RAM, màu). false: chỉ
            đặt trong Product.attributes (CPU). Đặt sai chỗ trả 422.

    CategoryAttribute:
      allOf:
        - $ref: "#/components/schemas/Attribute"
        - type: object
          required: [required, position, inherited]
          properties:
            required:  { type: boolean, description: "Bắt buộc khi sản phẩm live." }
            position:  { type: integer }
            inherited: { type: boolean, description: "Gán ở danh mục cha, không ở chính danh mục này." }

    Facet:
      type: object
      required: [code, name, type, unit, variant, values]
      properties:
        code:    { type: string }
        name:    { type: string }
        type:    { type: string, enum: [text, number, boolean, enum] }
        unit:    { type: string }
        variant: { type: boolean }
        values:
          type: array
          description: Nhiều sản phẩm trước, rồi theo giá trị.
          items:
            type: object
            required: [value, count]
            properties:
              value: { type: string }
              count: { type: integer }

    CreateAttributeRequest:
      type: object
      additionalProperties: false
      required: [code, name, type]
      properties:
        code:       { type: string, pattern: "^[a-z0-9]+(_[a-z0-9]+)*$" }
        name:       { type: string, maxLength: 100 }
        type:       { type: string, enum: [text, number, boolean, enum] }
        unit:       { type: string, maxLength: 20 }
        options:    { type: array, items: { type: string }, description: "Bắt buộc với enum, cấm với kiểu khác." }
        filterable: { type: boolean, default: false }
        variant:    { type: boolean, default: false }

    UpdateAttributeRequest:
      type: object
      additionalProperties: false
      description: >-
        Không có code, type, variant — chúng bất biến; gửi lên trả 400
        MALFORMED_REQUEST. Bỏ một giá trị enum đang dùng được phép: dữ liệu cũ
        không bị sửa, sản phẩm đó báo lỗi ở lần ghi kế tiếp.
      properties:
        name:       { type: string, maxLength: 100 }
        unit:       { type: string, maxLength: 20 }
        options:    { type: array, items: { type: string } }
        filterable: { type: boolean }

    SetCategoryAttributesRequest:
      type: object
      additionalProperties: false
      required: [attributes]
      properties:
        attributes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [attribute_id]
            properties:
              attribute_id: { type: string, format: uuid }
              required:     { type: boolean, default: false }
              position:     { type: integer, default: 0 }

    Brand:
      type: object
      required: [id, slug, name]
      properties:
        id:   { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }

    CategoryNode:
      type: object
      description: Một danh mục đứng riêng, không kèm cây con — trả về từ API quản trị.
      required: [id, parent_id, slug, name, position]
      properties:
        id:        { type: string, format: uuid }
        parent_id: { type: ["string", "null"], format: uuid, description: "null nghĩa là danh mục gốc." }
        slug:      { type: string }
        name:      { type: string }
        position:  { type: integer }

    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:      { type: string, maxLength: 100 }
        slug:
          type: string
          description: "Bỏ trống thì sinh từ tên. Có thì vẫn được chuẩn hóa (bỏ dấu, chữ thường)."
        parent_id: { type: ["string", "null"], format: uuid, description: "Bỏ trống hoặc null là danh mục gốc." }
        position:  { type: integer, default: 0 }

    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      description: >-
        Sửa TỪNG PHẦN, trường vắng mặt giữ nguyên. Đổi `name` KHÔNG đổi `slug`
        (slug nằm trong URL đã được index) — muốn đổi slug thì gửi `slug`.
      properties:
        name:      { type: string, maxLength: 100 }
        slug:      { type: string }
        parent_id:
          type: ["string", "null"]
          format: uuid
          description: >-
            BA trạng thái: vắng mặt = giữ nguyên chỗ; null = lên làm danh mục
            gốc; uuid = chuyển vào dưới danh mục đó. Chuyển vào chính nó hoặc
            con cháu của nó trả 422 CATEGORY_CYCLE.
        position:  { type: integer }

    CreateBrandRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        slug: { type: string, description: "Bỏ trống thì sinh từ tên." }

    UpdateBrandRequest:
      type: object
      additionalProperties: false
      description: "Sửa từng phần. Đổi `name` KHÔNG đổi `slug`."
      properties:
        name: { type: string, maxLength: 100 }
        slug: { type: string }

    CreateProductRequest:
      type: object
      # Server dùng DisallowUnknownFields: trường lạ trả 400 MALFORMED_REQUEST.
      # Thiếu dòng này thì theo JSON Schema nghĩa là CHO PHÉP trường thêm, và
      # frontend gửi kèm một field của UI sẽ ăn 400 dù spec bảo hợp lệ.
      additionalProperties: false
      required: [name, category_id, brand_id, variants]
      properties:
        name:              { type: string, maxLength: 200 }
        short_description: { type: string }
        category_id:       { type: string, format: uuid }
        brand_id:          { type: string, format: uuid }
        variants:
          type: array
          minItems: 1
          description: >-
            Ít nhất một phiên bản (422 VARIANT_REQUIRED). Từ 0.4.0 `sku` và
            `price` nằm ở đây, không còn ở cấp sản phẩm.
          items: { $ref: "#/components/schemas/CreateVariantRequest" }
        attributes:        { type: object, additionalProperties: { type: string } }
        images:
          type: array
          items: { type: string }
          description: >-
            KHÓA media (`Media.key`, ví dụ "products/0190….jpg"), KHÔNG phải URL
            — từ 0.6.0. Hiển thị qua imgproxy của storefront. Ghi sản phẩm với
            key chưa ready trả 422, trường images[i] mã UNKNOWN_IMAGE.

    UpdateProductRequest:
      type: object
      additionalProperties: false
      description: >-
        Sửa TỪNG PHẦN: mọi trường đều không bắt buộc, và trường vắng mặt GIỮ
        NGUYÊN giá trị đang có. Gửi `{}` là lệnh không đổi gì.


        Ràng buộc của sản phẩm đang "live" được kiểm trên trạng thái SAU khi
        sửa: không thể PATCH để nó còn 0 ảnh (422 NO_IMAGE).


        Từ 0.4.0 không còn `price`/`currency`: giá thuộc phiên bản — sửa qua
        PATCH /admin/products/{id}/variants/{variantId}. Gửi `price` ở đây trả
        400 MALFORMED_REQUEST.
      properties:
        name:
          type: string
          maxLength: 200
          description: "Đổi tên sẽ sinh lại slug; trùng slug sản phẩm khác trả 409 DUPLICATE_SLUG."
        short_description: { type: string }
        attributes:        { type: object, additionalProperties: { type: string } }
        images:
          type: array
          items: { type: string }
          description: >-
            KHÓA media (`Media.key`, ví dụ "products/0190….jpg"), KHÔNG phải URL
            — từ 0.6.0. Hiển thị qua imgproxy của storefront. Ghi sản phẩm với
            key chưa ready trả 422, trường images[i] mã UNKNOWN_IMAGE.
        category_id:
          type: string
          format: uuid
          description: "Chuyển sang danh mục khác. Không tồn tại trả 422 CATEGORY_NOT_FOUND."
        brand_id:
          type: string
          format: uuid
          description: "Đổi thương hiệu. Không tồn tại trả 422 BRAND_NOT_FOUND."
