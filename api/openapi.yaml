      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordStockMovementRequest" }
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMovementResult" }
        "200":
          description: Gửi lại cùng Idempotency-Key — kết quả của lần đầu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMovementResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
