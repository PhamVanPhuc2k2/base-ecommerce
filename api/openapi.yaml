openapi: 3.1.0
info:
  title: base-ecommerce API
  version: 0.12.0
  description: |
    Hợp đồng API. Đây là NGUỒN SỰ THẬT — sửa endpoint thì sửa file này trước.
servers:
  - url: http://localhost:8080/api/v1
    description: Máy dev

paths:
  /products:
    get:
      operationId: listProducts
      summary: Danh sách sản phẩm có lọc và phân trang
      security: []   # công khai — tuyên bố chủ động, không suy ra từ việc thiếu
      description: |
        Ngoài các tham số liệt kê dưới đây, endpoint còn chấp nhận lọc theo
        thuộc tính tự do qua tiền tố `attr.`: mỗi cặp `attr.<tên>=<giá trị>`
        lọc sản phẩm có thuộc tính `<tên>` bằng đúng `<giá trị>`, ví dụ
        `?attr.ram=16GB&attr.socket=AM5`. `<tên>` là tên thuộc tính bất kỳ do
        người bán tự đặt (lưu trong `Product.attributes`), nên không thể liệt
        kê hết trong OpenAPI — không có giới hạn nào ngoài quy ước tiền tố này.

        ⚠️ Type sinh bằng `openapi-typescript` KHÔNG phủ tham số này: object
        `query` sinh ra là object đóng, không có index signature. Frontend phải
        tự nối `attr.<tên>=<giá trị>` vào query string thay vì truyền qua tham
        số `query` đã sinh type.
      parameters:
        # Mọi description đều phải nằm trong nháy kép. Trong flow mapping { }
        # dấu phẩy KẾT THÚC plain scalar, nên `description: Giá tối thiểu, chuỗi
        # thập phân VND.` bị parse thành description "Giá tối thiểu" CỘNG một
        # property rác tên "chuỗi thập phân VND.". File vẫn sinh được type TS nên
        # openapi-drift xanh, nhưng validator OpenAPI 3.1 báo lỗi.
        - name: category
          in: query
          schema: { type: string }
          description: "Lọc theo slug danh mục, bao gồm toàn bộ danh mục con."
        - name: brand
          in: query
          schema: { type: string }
          description: "Lọc theo slug thương hiệu."
        - name: price_min
          in: query
          schema: { type: string }
          description: "Giá tối thiểu, chuỗi thập phân VND."
        - name: price_max
          in: query
          schema: { type: string }
          description: "Giá tối đa, chuỗi thập phân VND."
        - name: sort
          in: query
          schema: { type: string, enum: [newest, price_asc, price_desc] }
          description: "Giá trị ngoài danh sách này trả 400 INVALID_SORT."
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 1 }
          description: >-
            Vượt 200 trả 400 PAGE_TOO_DEEP: offset sâu quá đắt. Không phải số
            trả 400 INVALID_PAGINATION. Nhỏ hơn 1 thì bị kẹp về 1.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
          description: >-
            Không phải số trả 400 INVALID_PAGINATION. Ngoài khoảng thì bị KẸP về
            biên chứ không bị từ chối: 0 và số âm thành 24, lớn hơn 100 thành
            100. Đọc `meta.limit` để biết server thật sự dùng bao nhiêu.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductList" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /products/facets:
    get:
      operationId: listProductFacets
      security: []
      summary: Số sản phẩm theo từng giá trị của các thuộc tính lọc được
      description: >-
        Cùng bộ tham số với GET /products (category, brand, price_min, price_max, attr.*); page/limit/sort bị bỏ qua. Số cạnh mỗi giá trị là số sản phẩm sẽ thấy nếu bấm
        thêm giá trị đó (đếm với MỌI bộ lọc đang áp, kể cả của chính nhóm đó).
        Không có `category` thì `data` rỗng — thuộc tính thuộc về danh mục.
        Cache 60 giây.
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: brand, in: query, schema: { type: string } }
        - { name: price_min, in: query, schema: { type: string } }
        - { name: price_max, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Facet" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /products/{slug}:
    get:
      operationId: getProductBySlug
      security: []
      summary: Chi tiết sản phẩm theo slug
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /categories:
    get:
      operationId: getCategoryTree
      security: []
      summary: Cây danh mục
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /brands:
    get:
      operationId: listBrands
      security: []
      summary: Toàn bộ thương hiệu, sắp theo tên
      description: >-
        Danh sách ngắn (vài trăm), không phân trang. Frontend dùng để hiện tên
        thương hiệu từ `Product.brand_id`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Brand" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /sitemap/products:
    get:
      operationId: sitemapProducts
      security: []
      summary: Slug + ngày cập nhật của sản phẩm live, cho sitemap phân mảnh
      description: >-
        5.000 dòng mỗi trang, sắp theo id — sản phẩm mới luôn rơi vào trang
        CUỐI, trang cũ không bị dồn dịch. Không có trần 200 trang như GET
        /products (câu này chạy trên index hẹp, Index Only Scan). Trang vượt
        quá trả `data` rỗng, không báo lỗi.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [slug, updated_at]
                      properties:
                        slug:       { type: string }
                        updated_at: { type: string, format: date-time }
                  meta:
                    type: object
                    required: [page, page_size, total, total_pages]
                    properties:
                      page:        { type: integer }
                      page_size:   { type: integer }
                      total:       { type: integer }
                      total_pages: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/register:
    post:
      operationId: register
      security: []
      summary: Đăng ký bằng email + mật khẩu, trả phiên đăng nhập luôn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Đã tạo tài khoản và phiên
          headers:
            Cache-Control: { schema: { type: string, examples: ["no-store"] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429":
          description: Quá nhiều lần thử — 5/phút theo IP và theo email.
          headers:
            Retry-After: { schema: { type: integer }, description: "Số giây phải chờ." }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/login:
    post:
      operationId: login
      security: []
      summary: Đăng nhập
      description: >-
        Email không tồn tại và sai mật khẩu trả CÙNG 401 INVALID_CREDENTIALS, cùng
        thời gian phản hồi — không dò được email nào đã đăng ký.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: OK
          headers:
            Cache-Control: { schema: { type: string, examples: ["no-store"] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429":
          description: Quá nhiều lần thử — 5/phút theo IP và theo email.
          headers:
            Retry-After: { schema: { type: integer }, description: "Số giây phải chờ." }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/refresh:
    post:
      operationId: refreshSession
      security: []
      summary: Đổi refresh token lấy cặp token mới (xoay vòng)
      description: >-
        Refresh token chỉ dùng được MỘT lần. Đưa lên lại một token đã dùng → 401
        và CẢ chuỗi phiên bị thu hồi (dấu hiệu token bị đánh cắp).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: OK
          headers:
            Cache-Control: { schema: { type: string, examples: ["no-store"] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429":
          description: Quá nhiều lần thử — 5/phút theo IP và theo email.
          headers:
            Retry-After: { schema: { type: integer }, description: "Số giây phải chờ." }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/logout:
    post:
      operationId: logout
      security: []
      summary: Thu hồi cả chuỗi phiên của refresh token
      description: Luôn 204, kể cả với token lạ — đăng xuất phải luôn "được".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Đã đăng xuất }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/email/verification:
    post:
      operationId: requestEmailVerification
      summary: Gửi (lại) mã xác minh email
      description: >-
        Mã 6 số, sống 10 phút, sai 5 lần là chết; xin mã mới giết mã cũ. Hai
        lần xin cách nhau tối thiểu 60 giây — sớm hơn thì 429 kèm Retry-After.
        Đăng ký đã tự gửi một mã.
      security: [{ bearerAuth: [] }]
      responses:
        "202": { description: Đã xếp thư vào hàng đợi }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/email/verify:
    post:
      operationId: verifyEmail
      summary: Xác minh email bằng mã trong thư
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Đã xác minh
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Gửi mã đặt lại mật khẩu
      description: >-
        LUÔN 202 với email đúng cú pháp — có tài khoản hay không, bị khóa hay
        không, đang trong 60 giây chờ hay không. Khác đi là tiết lộ email nào
        đã đăng ký.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string }
      responses:
        "202": { description: Nếu email có tài khoản thì thư đang trên đường tới }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Đặt mật khẩu mới bằng mã trong thư
      description: >-
        Thành công thì MỌI phiên đăng nhập (refresh token) của tài khoản bị thu
        hồi, và email được coi là đã xác minh. Email không tồn tại trả đúng
        422 INVALID_OTP như mã sai.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, code, new_password]
              properties:
                email:        { type: string }
                code:         { type: string, pattern: "^[0-9]{6}$" }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Đã đổi mật khẩu }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /me:
    get:
      operationId: getMe
      summary: Người đang đăng nhập
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateMe
      summary: Sửa họ tên
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [full_name]
              properties:
                full_name: { type: string, maxLength: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /me/addresses:
    get:
      operationId: listAddresses
      summary: Sổ địa chỉ — mặc định đứng đầu, rồi mới nhất
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Address" }
        "401": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAddress
      summary: Thêm địa chỉ (tối đa 10; địa chỉ đầu tiên tự thành mặc định)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressRequest" }
      responses:
        "201":
          description: Đã thêm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /me/addresses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateAddress
      summary: Sửa địa chỉ — trường không gửi thì giữ nguyên
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteAddress
      summary: Xóa địa chỉ — xóa địa chỉ mặc định thì địa chỉ mới nhất còn lại lên thay
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Đã xóa }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /me/addresses/{id}/default:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: setDefaultAddress
      summary: Đặt làm địa chỉ mặc định
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /attributes:
    get:
      operationId: listAttributes
      security: []
      summary: Mọi định nghĩa thuộc tính
      description: Danh sách ngắn, không phân trang. Storefront dùng để đổi mã thuộc tính ra tên và đơn vị.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Attribute" }
        "500": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /categories/{slug}/attributes:
    get:
      operationId: getCategoryAttributes
      security: []
